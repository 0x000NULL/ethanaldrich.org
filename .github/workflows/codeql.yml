# Static analysis. Free on public repos, and its absence was conspicuous on a
# repo whose SECURITY.md enumerates its controls. The npm audit job in test.yml
# covers known-vulnerable dependencies; this covers the code in this repo.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Advisories land between pushes, so re-scan the tree weekly even when
    # nothing changes. Monday 07:00 UTC.
    - cron: "0 7 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
